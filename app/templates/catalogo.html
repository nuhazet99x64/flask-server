{%extends 'base.html'%}

{%block content%}

<h1>Catalogo</h1>
<h2>Nombre:{{nombre}}</h2>
<h3>Listado de productos</h3>
<ul>
    {%for producto in lista_productos %}
    <li>
        <a href="{{ url_for('producto',idProducto=loop.index0) }}"><strong>{{producto.nombre}}</strong></a>
        {{producto.precio}}€
        {% if producto.disponible %}
        <span style="color: green;">En stock</span>
        {%else%}
        <span style="color: red;">Agotado</span>
        {%endif%}
    </li>
    {%endfor%}
</ul>
{%endblock%}
